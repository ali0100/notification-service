databaseChangeLog:
  - changeSet:
      id: 001-create-notifications
      author: system
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipient_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: template_code
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: channel_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: parameters
                  type: jsonb
              - column:
                  name: priority
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_recipient_id
            columns:
              - column:
                  name: recipient_id
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_status
            columns:
              - column:
                  name: status