databaseChangeLog:
  - changeSet:
      id: 002-create-notification-templates
      author: system
      changes:
        - createTable:
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: template_code
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: channel_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: notification_templates
            columnNames: template_code,channel_type
            constraintName: uq_templates_code_channel
